name: dotnet package

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci # global group
  cancel-in-progress: false # let them run
  # this will disable CI parellelism
  # TODO: refactor use of test users to allow running in parallel

jobs:
  test:
    permissions:
      contents: read
      actions: read
      checks: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            6.x.x
            8.x.x
            9.x.x
            10.x.x
      - name: Install dependencies
        run: dotnet restore --locked-mode
      - name: Build with dotnet
        run: dotnet build --no-restore --configuration Release
      - name: Test with dotnet
        timeout-minutes: 30
        env:
          AppSettings__ProjectId: ${{ secrets.DOT_NET_PROJECT_ID }}
          AppSettings__ManagementKey: ${{ secrets.DOT_NET_MANAGEMENT_KEY_ID }}
        # serialized: the integration test throttle is per-process, so parallel frameworks 4x the live API rate
        run: |
          for tfm in net6.0 net8.0 net9.0 net10.0; do
            dotnet test --no-build --configuration Release --framework "$tfm" --logger trx --results-directory "TestResults" --blame --blame-hang --blame-hang-timeout 1min --diag "TestResults/vstest_$tfm.log"
          done

      - name: Upload dotnet test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-results
          path: TestResults
      - name: Post test results to GitHub
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always()
        with:
          name: .NET Tests
          path: TestResults/**/*.trx
          reporter: dotnet-trx
